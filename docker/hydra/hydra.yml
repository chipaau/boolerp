# Ory Hydra for development (C83, C89). Secrets (the database address and the
# system secret) are in a second config file mounted as a secret, merged in order
# (`serve all -c this -c secret`).
version: v26.2.0

serve:
  public:
    # Browsers and clients reach these paths on identity.bool.test through Traefik
    # (/oauth2/*, /.well-known/openid-configuration, /.well-known/jwks.json, /userinfo).
    port: 4444
    cors:
      enabled: false
  admin:
    # Only on the internal network: never routed through the proxy.
    port: 4445

urls:
  self:
    # The issuer is the login domain itself (C89).
    issuer: http://identity.bool.test/
  # Kratos runs the login (its oauth2_provider integration); the consent step is a
  # route of the Next.js login service (C87), which approves first-party clients.
  login: http://identity.bool.test/login
  registration: http://identity.bool.test/registration
  consent: http://identity.bool.test/consent
  # Hydra's logout step: the login service ends the Kratos session and accepts it (C101).
  logout: http://identity.bool.test/logout
  # Where a logout no app started ends (one confirmed on the login service). An app's
  # logout returns to one of that client's post_logout_redirect_uris instead.
  post_logout_redirect: http://identity.bool.test/
  error: http://identity.bool.test/error

oidc:
  subject_identifiers:
    supported_types: [public]

# What discovery advertises: the consent route puts these claims into the ID token
# (and /userinfo) for the granted email, phone, and profile scopes.
webfinger:
  oidc_discovery:
    supported_scope: [email, phone, profile, offline_access]
    supported_claims: [email, email_verified, phone_number, name, picture]

# Access tokens are JWTs that the API verifies locally against Hydra's published
# keys (C91), valid for 10 minutes; the BFF refreshes them. Refresh tokens last
# 12 hours, as Kratos sessions and BFF sessions do (C96), instead of Hydra's 30
# days. Other lifetimes are Hydra's defaults (C89).
strategies:
  access_token: jwt
ttl:
  access_token: 10m
  refresh_token: 12h

oauth2:
  # Every authorization code flow must use PKCE (RFC 7636), confidential clients
  # too (ASVS V10, C111); the BFFs always send it.
  pkce:
    enforced: true
  # Refresh tokens rotate on every use. A used one stays valid for a minute, so
  # two requests refreshing at once (several BFF processes, or a request that read
  # the tokens just before another saved new ones) do not look like token theft,
  # which would revoke the session's tokens; later reuse still does (C98).
  grant:
    refresh_token:
      rotation_grace_period: 1m

log:
  level: info
  format: json
  leak_sensitive_values: false
