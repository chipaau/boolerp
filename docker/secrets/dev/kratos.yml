# Kratos's development secrets (C80, C85), merged over docker/kratos/kratos.yml.
# Throwaway local values, committed like the other files in this folder.

# Kratos's own database and role (docker/postgres/init/20-kratos.sh); the
# password matches db_kratos_password.
dsn: postgres://erp_kratos:erp_kratos@postgres:5432/kratos?sslmode=disable&max_conns=10

secrets:
  cookie:
    - e42zp5TWZ2xZB6dpQFjoNBYwdykcOHqJ
  cipher:
    - IPtcx3vFd5nuDgGvQNRM7MKJa2ethAAQ

selfservice:
  methods:
    oidc:
      config:
        providers:
          # "google" is the stand-in provider in development and CI (C85): real
          # Google refuses redirects to .test domains.
          - id: google
            provider: generic
            label: Google (development)
            client_id: kratos
            client_secret: dev-oidc-secret
            issuer_url: http://oidc.bool.test/default
            mapper_url: file:///etc/kratos/oidc.google.jsonnet
            scope: [openid, email, profile]
