# Kratos's development secrets (C80, C85), merged over docker/kratos/kratos.yml.
# Throwaway local values, committed like the other files in this folder.

# Kratos's own database and role (docker/postgres/init/20-kratos.sh); the
# password matches db_kratos_password.
dsn: postgres://erp_kratos:erp_kratos@postgres:5432/kratos?sslmode=disable&max_conns=10

secrets:
  cookie:
    - e42zp5TWZ2xZB6dpQFjoNBYwdykcOHqJ
  cipher:
    - IPtcx3vFd5nuDgGvQNRM7MKJa2ethAAQ

selfservice:
  methods:
    oidc:
      config:
        providers:
          # "google" is the stand-in provider in development and CI (C85): real
          # Google refuses redirects to .test domains.
          - id: google
            provider: generic
            label: Google (development)
            client_id: kratos
            client_secret: dev-oidc-secret
            issuer_url: http://oidc.bool.test/default
            mapper_url: file:///etc/kratos/oidc.google.jsonnet
            scope: [openid, email, profile]

# After registration: the usual hooks, then the web hook that creates the
# account's user in the API (C94). It goes to the API's internal listener, sends
# only the account ID with the shared key (identity_webhook_key), and does not
# block registration (ignore: true); the API also creates users on first use.
  flows:
    registration:
      after:
        password:
          hooks:
            - hook: web_hook
              config: &user_created
                url: http://api:8081/internal/identity/kratos
                method: POST
                body: file:///etc/kratos/user-created.jsonnet
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Key
                    value: 0ixQRVkZAvRrPDzl8m8a1Ox66UNa6dWfnWG9zPNS4JGfpQRI
                    in: header
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: web_hook
              config: *user_created
            - hook: session
