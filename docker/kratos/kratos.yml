# Ory Kratos for development (C83, C85). Secrets (the database address and the
# cookie and cipher secrets) are in a second config file, mounted as a Compose
# secret: Kratos merges config files in order (`serve -c this -c secret`).
version: v26.2.0

serve:
  public:
    # Browsers reach Kratos under identity.bool.test/kratos through Traefik, which
    # strips the prefix; the login UI (7a-2) is served on the same host.
    base_url: http://identity.bool.test/kratos/
    cors:
      enabled: false
  admin:
    # Only on the internal network: never routed through the proxy.
    base_url: http://kratos:4434/

identity:
  # New accounts get "registration": one email (traits.email). Extra addresses are
  # added only through the admin API, already verified, into traits.additional_emails,
  # switching the account to "account" (up to 9 more), so no account holds an unverified address
  # that could block its real owner (C85).
  default_schema_id: registration
  schemas:
    - id: registration
      url: file:///etc/kratos/registration.schema.json
    - id: account
      url: file:///etc/kratos/account.schema.json

# Kratos runs Hydra's login step (C83, C89): it reads and accepts Hydra's login
# request through Hydra's admin API, on the internal network.
oauth2_provider:
  url: http://hydra:4445

selfservice:
  default_browser_return_url: http://identity.bool.test/
  allowed_return_urls:
    - http://identity.bool.test

  methods:
    # Account fields (emails, phone, name) are not editable in self-service
    # settings (C85): Kratos cannot make a field read-only, and emails may only
    # be added verified through the admin API. Password changes remain.
    profile:
      enabled: false
    password:
      enabled: true
      # Kratos's default policy (C85): minimum length 8, the Have I Been Pwned
      # check (k-anonymity), and no failure when that service is unreachable.
    oidc:
      enabled: true
      # The provider "google" is defined per environment: the stand-in provider
      # in the secret config file here, real Google on public environments.
    code:
      # One-time codes are used for verification and recovery, not for login.
      passwordless_enabled: false

  flows:
    error:
      ui_url: http://identity.bool.test/error
    settings:
      ui_url: http://identity.bool.test/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      use: code
      ui_url: http://identity.bool.test/recovery
    verification:
      enabled: true
      use: code
      ui_url: http://identity.bool.test/verification
    logout:
      after:
        default_browser_return_url: http://identity.bool.test/login
    login:
      ui_url: http://identity.bool.test/login
      after:
        password:
          hooks:
            # The account must have a verified email before it can log in (C85).
            # Kratos accepts any verified address on the account, not only the
            # one typed; with one email at registration they are the same.
            - hook: require_verified_address
    registration:
      ui_url: http://identity.bool.test/registration
      after:
        password:
          hooks:
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session

# A Kratos session lasts 12 hours, so a password is asked for at least every 12
# hours (C96); a BFF session that ends sooner signs back in through it silently.
session:
  lifespan: 12h

courier:
  smtp:
    # Mailpit catches every email in development (C85).
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@bool.test
    from_name: Bool
  channels:
    # SMS goes to Mailpit's send API in development (C85).
    - id: sms
      type: http
      request_config:
        url: http://mailpit:8025/api/v1/send
        method: POST
        body: file:///etc/kratos/sms.jsonnet
        headers:
          Content-Type: application/json

# Tokens from social logins are stored encrypted with secrets.cipher; without an
# algorithm Kratos would store them in plaintext.
ciphers:
  algorithm: xchacha20-poly1305

log:
  level: info
  format: json
  leak_sensitive_values: false
