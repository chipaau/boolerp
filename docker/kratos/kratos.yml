# Ory Kratos — dev config. Served same-origin under /auth on each tenant subdomain (Traefik strips
# /auth; base_url re-advertises it). Self-registration is DISABLED — identities are minted by the
# provisioning flow via the admin API; owners/members set their first credential via the recovery
# (activation) flow. NOTE: dev uses a single tenant base_url (malecouncil); correct per-subdomain
# link generation and the 30-min sliding idle timeout (Kratos lifespan below is absolute) are
# follow-ups. Secrets here are throwaway dev values.
version: v1.3.1

dsn: postgres://goerp:goerp@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://malecouncil.bool.test/auth/
    cors:
      enabled: false
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://malecouncil.bool.test/
  allowed_return_urls:
    - http://malecouncil.bool.test/
    - http://admin.bool.test/
  methods:
    password:
      enabled: true
      config:
        min_password_length: 8
    totp:
      enabled: true
      config:
        issuer: Bool ERP
    webauthn:
      enabled: true
      config:
        passwordless: true
        rp:
          id: bool.test
          display_name: Bool ERP
          origins:
            - http://malecouncil.bool.test
    code:
      enabled: true
      config:
        lifespan: 15m
    link:
      enabled: false
    oidc:
      enabled: false
  flows:
    registration:
      enabled: false
    login:
      lifespan: 15m
    settings:
      required_aal: highest_available
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      use: code
      lifespan: 30m
    verification:
      enabled: true
      use: code
      lifespan: 30m
    logout:
      after:
        default_browser_return_url: http://malecouncil.bool.test/login
    error:
      ui_url: http://malecouncil.bool.test/error

session:
  lifespan: 12h
  cookie:
    domain: bool.test
    same_site: Lax
    name: ory_kratos_session
    persistent: true
  whoami:
    required_aal: aal1

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@bool.test
    from_name: Bool ERP

secrets:
  cookie:
    - dev-insecure-cookie-secret-change-me
  cipher:
    - 0123456789abcdef0123456789abcdef

log:
  level: info
  format: json
  leak_sensitive_values: false
