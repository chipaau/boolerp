# Shared local reverse proxy for every dev stack on this machine: Traefik on :80/:443 routing by
# Host, plus dnsmasq so *.bool.test resolves to loopback without editing /etc/hosts per tenant.
# Run once, leave running; the app stack (../../compose.yaml) attaches to the `proxy` network.
#
#   docker network create proxy            # first time only
#   COMPOSE_PROFILES=local docker compose up -d
#
# See README.md for the one-time macOS resolver step.
services:
  dnsmasq:
    image: dockurr/dnsmasq
    container_name: dnsmasq
    restart: unless-stopped
    profiles:
      - local
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:53:53/tcp"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.file.filename=/traefik/dynamic.yml
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --accesslog
      - --accesslog.filepath=/traefik/logs/access.log
      - --log
      - --log.level=INFO
      - --log.filepath=/traefik/logs/general.log
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/traefik/logs
      - ./dynamic.yml:/traefik/dynamic.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.bool.test`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=web

networks:
  proxy:
    external: true
