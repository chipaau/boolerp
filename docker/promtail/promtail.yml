server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Auto-discovers every container on this compose stack via the Docker API — no per-service config
  # needed as new services get added. Labels by compose service name so LogQL can filter with
  # {service="api"}; the api container's logs are JSON (log/slog), so they're also parsed into
  # structured fields — {service="api"} | json | request_id="..." finds one request's log lines
  # directly, the same id shown in an error response (see internal/respond.Error).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Docker socket is host-wide — without this filter, promtail discovers every container on
        # the machine (other projects included), not just this compose stack.
        filters:
          - name: label
            values: ["com.docker.compose.project=erp"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
    pipeline_stages:
      - match:
          selector: '{service="api"}'
          stages:
            - json:
                expressions:
                  level: level
                  request_id: request_id
                  trace_id: trace_id
            - labels:
                level:
