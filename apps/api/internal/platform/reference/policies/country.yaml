# reference:country (C199): the countries, a shared reference list. Reference data
# is not sensitive, so any signed-in person may list it, with no tenant or capability,
# checked like identity:user (C154).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: "reference:country"
  schemas:
    principalSchema:
      ref: cerbos:///authorization/caller.json
    resourceSchema:
      ref: cerbos:///reference/country.json
      # A list has no record.
      ignoreWhen:
        actions: ["list"]
  rules:
    - actions: ["list"]
      effect: EFFECT_ALLOW
      roles: ["user"]
