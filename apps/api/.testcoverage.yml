# Coverage threshold for CI (C119), checked by go-test-coverage
# (github.com/vladopajic/go-test-coverage, GPL-3.0, run as a tool only) in the API
# feature-test job, which runs the unit and feature tests together. A pull request
# that lowers total coverage below the threshold fails. Raise the threshold when
# coverage rises; never lower it to make a check pass.
profile: cover.out
threshold:
  total: 87
exclude:
  paths:
    # The process entry points only read settings, wire the build, and start a
    # process; the end-to-end suite runs them, which Go's coverage cannot see.
    # Everything they call (bootstrap, editions, modules) is counted.
    - ^cmd/
