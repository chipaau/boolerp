<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <title>Hexa</title>
    <!-- Lato is the single typeface (300 / 400 / 700 / 900). Self-host before the on-prem build. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved/system theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('goerp-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
