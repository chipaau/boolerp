name: erp

# Local dev stack. Attaches to the shared external `proxy` network (Traefik) at *.bool.test.

x-node: &node
  build:
    context: ./docker
    dockerfile: node.Dockerfile
  working_dir: /w
  volumes:
    - .:/w
    # Shadow node_modules with per-container volumes so the Linux-built deps here never collide
    # with the host's (macOS) pnpm install from the bind-mounted source tree above.
    - /w/node_modules
    - /w/apps/workspace/node_modules
    - /w/apps/admin/node_modules
    - /w/apps/website/node_modules
    - /w/apps/identity/node_modules
    - /w/packages/ui/node_modules
    - /w/packages/api-client/node_modules
    # pnpm's content-addressable store also needs to be off the bind mount: hard-linking large
    # packages through the host bind mount (osxfs/virtiofs) corrupts the store silently.
    - pnpm-store:/w/.pnpm-store

# One BFF program, one service per instance (C90, C96, C97): bff-workspace and bff-admin
# share everything below and differ in client, session key, and routes.
x-bff-env: &bff-env
  BFF_ENV: ${APP_ENV:-dev}
  BFF_PORT: "8080"
  BFF_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
  BFF_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  # One proxy (Traefik) appends to X-Forwarded-For (C40).
  BFF_HTTP_TRUSTED_PROXY_HOPS: "1"
  BFF_REDIS_HOST: redis-sessions
  BFF_REDIS_TLS: "false"
  # Plain HTTP in development: the cookie is "session", not Secure (C96).
  BFF_SESSION_COOKIE_SECURE: "false"
  BFF_OIDC_ISSUER: http://identity.bool.test/
  # /api/* is forwarded here with the session's access token (C98).
  BFF_API_URL: http://api:${APP_PORT:-8080}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}

x-bff: &bff
  build:
    context: .
    dockerfile: docker/go.Dockerfile
  working_dir: /w/apps/api
  command: ["sh", "-c", "go build -buildvcs=false -o /tmp/bool-bff ./cmd/bff && exec /tmp/bool-bff"]
  stop_grace_period: 40s
  develop:
    watch:
      - action: restart
        path: ./apps/api
        include:
          - "**/*.go"
          - go.mod
          - go.sum
        ignore:
          - "**/*_test.go"
  # Hydra's discovery, keys, and token endpoint are reached at the issuer's address.
  extra_hosts:
    - "identity.bool.test:host-gateway"
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 60s
  volumes:
    - .:/w
    - gocache:/root/.cache/go-build
    - gomod:/go/pkg/mod
  depends_on:
    redis-sessions:
      condition: service_healthy
    api:
      condition: service_healthy
  networks:
    - proxy
    - internal

services:
  # The login service (C86, C87): a Next.js app with Ory Elements drawn in the Bool
  # design, at http://identity.bool.test. Its /kratos path goes to Kratos (higher
  # priority); its server reads flows from Kratos over the internal network.
  identity:
    <<: *node
    command: pnpm --filter identity dev
    environment:
      IDENTITY_PUBLIC_URL: http://identity.bool.test
      KRATOS_INTERNAL_URL: http://kratos:4433
      # Hydra's admin API, for the consent route only (C87, C89).
      HYDRA_ADMIN_URL: http://hydra:4445
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-identity.rule=Host(`identity.bool.test`)"
      - traefik.http.routers.erp-identity.entrypoints=web
      - traefik.http.routers.erp-identity.priority=30
      - traefik.http.routers.erp-identity.service=erp-identity
      - traefik.http.services.erp-identity.loadbalancer.server.port=3000
      # Rate limits per client address (Traefik's ratelimit, C111): pages and Kratos's
      # public API here, Kratos's form submissions (sign-in, registration, recovery,
      # verification, settings) much tighter, on Kratos's routers below. Behind another
      # proxy in production, the limits need its ipStrategy to see the client address.
      - traefik.http.middlewares.erp-auth-limit.ratelimit.average=20
      - traefik.http.middlewares.erp-auth-limit.ratelimit.burst=50
      - traefik.http.routers.erp-identity.middlewares=erp-auth-limit

  workspace:
    <<: *node
    command: pnpm --filter workspace dev
    environment:
      # The workspace edition to serve (apps/app/editions/<name>.ts, C107).
      EDITION: ${EDITION:-full}
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-workspace.rule=HostRegexp(`^[a-z0-9-]+\\.bool\\.test$`)"
      - traefik.http.routers.erp-workspace.entrypoints=web
      - traefik.http.routers.erp-workspace.priority=1
      - traefik.http.routers.erp-workspace.service=erp-workspace
      - traefik.http.services.erp-workspace.loadbalancer.server.port=3000

  # The admin app's dev server (apps/admin) at admin.bool.test (C97), above the
  # tenant catch-all; /auth and /api go to bff-admin (C97, C98).
  admin:
    <<: *node
    command: pnpm --filter admin dev
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-admin.rule=Host(`admin.bool.test`)"
      - traefik.http.routers.erp-admin.entrypoints=web
      - traefik.http.routers.erp-admin.priority=2
      - traefik.http.routers.erp-admin.service=erp-admin
      - traefik.http.services.erp-admin.loadbalancer.server.port=3000

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-erp_app}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-erp_migrate}
      # Passwords arrive as files (C80): the image reads POSTGRES_PASSWORD_FILE,
      # and 10-roles.sh the other two.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/db_app_password
      POSTGRES_MIGRATE_PASSWORD_FILE: /run/secrets/db_migrate_password
      # Kratos's own database and role (20-kratos.sh, C85).
      POSTGRES_KRATOS_USER: erp_kratos
      POSTGRES_KRATOS_PASSWORD_FILE: /run/secrets/db_kratos_password
      # Hydra's own database and role (30-hydra.sh, C89).
      POSTGRES_HYDRA_USER: erp_hydra
      POSTGRES_HYDRA_PASSWORD_FILE: /run/secrets/db_hydra_password
    secrets: [postgres_password, db_app_password, db_migrate_password, db_kratos_password, db_hydra_password]
    volumes:
      # On first start with an empty volume, PostgreSQL creates the database and
      # 10-roles.sh creates the roles, then applies database-setup.psql (grants
      # and the migrations schema, C49, C79). The entrypoint ignores .psql files.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    working_dir: /w/apps/api
    command: ["sh", "-c", "go build -buildvcs=false -o /tmp/bool-api ./cmd/api && exec /tmp/bool-api"]
    # Longer than APP_SHUTDOWN_TIMEOUT (35s) so Docker's SIGKILL does not cut graceful shutdown short.
    stop_grace_period: 40s
    # `docker compose up --watch` restarts the container when API source changes;
    # the command above rebuilds, and the restart uses the normal graceful shutdown.
    develop:
      watch:
        - action: restart
          path: ./apps/api
          include:
            - "**/*.go"
            - go.mod
            - go.sum
          ignore:
            - "**/*_test.go"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_PORT: "${APP_PORT:-8080}"
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-35s}
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_HTTP_MAX_BODY_BYTES: ${APP_HTTP_MAX_BODY_BYTES:-1048576}
      APP_HTTP_READ_HEADER_TIMEOUT: ${APP_HTTP_READ_HEADER_TIMEOUT:-5s}
      APP_HTTP_READ_TIMEOUT: ${APP_HTTP_READ_TIMEOUT:-15s}
      APP_HTTP_WRITE_TIMEOUT: ${APP_HTTP_WRITE_TIMEOUT:-30s}
      APP_HTTP_IDLE_TIMEOUT: ${APP_HTTP_IDLE_TIMEOUT:-60s}
      # One proxy (Traefik) appends to X-Forwarded-For; production sets its real hop count (C40).
      APP_HTTP_TRUSTED_PROXY_HOPS: ${APP_HTTP_TRUSTED_PROXY_HOPS:-1}
      # The frontend is same-origin through Traefik, so no cross-origin access by default (C41).
      APP_HTTP_ALLOWED_ORIGINS: ${APP_HTTP_ALLOWED_ORIGINS:-}
      # Runtime role only; derived from the role PostgreSQL creates, so they stay in sync (C43).
      APP_DB_HOST: ${APP_DB_HOST:-postgres}
      APP_DB_PORT: ${APP_DB_PORT:-5432}
      APP_DB_NAME: ${POSTGRES_DB:-erp}
      APP_DB_USER: ${POSTGRES_APP_USER:-erp_app}
      APP_DB_PASSWORD_FILE: /run/secrets/db_app_password
      # Local PostgreSQL has no certificate; the application default is verify-full.
      APP_DB_SSLMODE: ${APP_DB_SSLMODE:-disable}
      APP_DB_MAX_CONNS: ${APP_DB_MAX_CONNS:-20}
      APP_DB_PING_TIMEOUT: ${APP_DB_PING_TIMEOUT:-2s}
      # Local Redis has no password or TLS; the application default is TLS on (C53).
      APP_REDIS_HOST: ${APP_REDIS_HOST:-redis}
      APP_REDIS_TLS: ${APP_REDIS_TLS:-false}
      # Traces and metrics use the standard OpenTelemetry variables (C55, C82). In
      # development both are on by default and export to the lgtm service (C82); set
      # OTEL_TRACES_EXPORTER or OTEL_METRICS_EXPORTER to none in .env to turn one
      # off. The sampler is passed only when set, since the SDK rejects empty values.
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://lgtm:4318}
      OTEL_TRACES_SAMPLER:
      # Callers present Hydra access tokens, verified against Hydra's keys (C91).
      APP_AUTH_ISSUER: http://identity.bool.test/
      # Users are read from Kratos's admin API on first use (C94).
      APP_IDENTITY_KRATOS_ADMIN_URL: http://kratos:4434
      # Disabling an account ends its Hydra logins and tokens (C101).
      APP_IDENTITY_HYDRA_ADMIN_URL: http://hydra:4445
    # Only the runtime role's password; never the owner's or the migration role's (C47).
    secrets: [db_app_password]
    # The API fetches Hydra's keys from the issuer's address, through Traefik on the host.
    extra_hosts:
      - "identity.bool.test:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${APP_PORT:-8080}/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - .:/w
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # api.bool.test → the Go API, for clients with their own Bearer tokens (C98);
      # app domains' /api/* goes through their BFF instead. Above the tenant routes.
      - "traefik.http.routers.erp-api.rule=Host(`api.bool.test`)"
      - traefik.http.routers.erp-api.entrypoints=web
      - traefik.http.routers.erp-api.priority=30
      - traefik.http.routers.erp-api.service=erp-api
      # Per-IP rate limiting is the proxy's job, not the API's (C81): a backstop of
      # 1000 requests a minute per client IP, with bursts of 100 (a screen's parallel
      # calls). Traefik is the edge here, so it counts the connecting address; behind
      # another proxy or CDN, set sourcecriterion.ipstrategy.depth to reach the client.
      - traefik.http.routers.erp-api.middlewares=erp-api-ratelimit
      - traefik.http.middlewares.erp-api-ratelimit.ratelimit.average=1000
      - traefik.http.middlewares.erp-api-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.erp-api-ratelimit.ratelimit.burst=100
      - "traefik.http.services.erp-api.loadbalancer.server.port=${APP_PORT:-8080}"

  # One-off migrations as the migration role (C47): `docker compose run --rm migrate`.
  # The "tools" profile keeps it out of `docker compose up`. It is the only service
  # given the migration role's password (C80).
  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    working_dir: /w/apps/api
    command: ["go", "run", "./cmd/migrate"]
    environment:
      MIGRATE_DB_HOST: postgres
      MIGRATE_DB_NAME: ${POSTGRES_DB:-erp}
      MIGRATE_DB_USER: ${POSTGRES_MIGRATE_USER:-erp_migrate}
      MIGRATE_DB_PASSWORD_FILE: /run/secrets/db_migrate_password
      # Local PostgreSQL has no certificate; the application default is verify-full.
      MIGRATE_DB_SSLMODE: disable
    secrets: [db_migrate_password]
    volumes:
      - .:/w
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The BFF's session store (C90, ADR 0003), separate from the API's cache Redis:
  # eviction is off (noeviction), so sessions are never dropped for memory, and
  # writes are persisted (AOF), so a restart keeps people signed in. Internal
  # network only; production adds a password and TLS.
  redis-sessions:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - redis-sessions:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend-for-frontend for the app on tenant domains (C90, C96): signs browsers
  # in through Hydra at /auth/* and keeps their sessions in redis-sessions.
  # /api/* still goes straight to the API until the BFF forwards it (7c-3).
  bff-workspace:
    <<: *bff
    environment:
      <<: *bff-env
      BFF_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/bff_workspace_session_key
      BFF_OIDC_CLIENT_ID: erp-workspace
      BFF_OIDC_CLIENT_SECRET_FILE: /run/secrets/hydra_client_erp-workspace
      OTEL_SERVICE_NAME: bool-erp-bff-workspace
    secrets: [bff_workspace_session_key, hydra_client_erp-workspace]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # /auth/* and /api/* on every tenant subdomain -> the BFF (above the app's
      # catch-all), with the API's per-IP rate limit (C81).
      - "traefik.http.routers.erp-bff-workspace.rule=HostRegexp(`^[a-z0-9-]+\\.bool\\.test$`) && (PathPrefix(`/auth`) || PathPrefix(`/api`))"
      - traefik.http.routers.erp-bff-workspace.entrypoints=web
      - traefik.http.routers.erp-bff-workspace.priority=20
      - traefik.http.routers.erp-bff-workspace.middlewares=erp-api-ratelimit
      - traefik.http.routers.erp-bff-workspace.service=erp-bff-workspace
      - traefik.http.services.erp-bff-workspace.loadbalancer.server.port=8080

  # Backend-for-frontend for the admin app at admin.bool.test (C90, C97): the same
  # program with its own Hydra client, session key, and session key prefix.
  bff-admin:
    <<: *bff
    environment:
      <<: *bff-env
      BFF_SESSION_ENCRYPTION_KEY_FILE: /run/secrets/bff_admin_session_key
      BFF_OIDC_CLIENT_ID: erp-admin
      BFF_OIDC_CLIENT_SECRET_FILE: /run/secrets/hydra_client_erp-admin
      OTEL_SERVICE_NAME: bool-erp-bff-admin
    secrets: [bff_admin_session_key, hydra_client_erp-admin]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # admin.bool.test/auth/* and /api/* -> bff-admin, above the tenant routes (C97).
      - "traefik.http.routers.erp-bff-admin.rule=Host(`admin.bool.test`) && (PathPrefix(`/auth`) || PathPrefix(`/api`))"
      - traefik.http.routers.erp-bff-admin.entrypoints=web
      - traefik.http.routers.erp-bff-admin.priority=25
      - traefik.http.routers.erp-bff-admin.middlewares=erp-api-ratelimit
      - traefik.http.routers.erp-bff-admin.service=erp-bff-admin
      - traefik.http.services.erp-bff-admin.loadbalancer.server.port=8080

  # Identity (C83, C85): Ory Kratos holds accounts and runs the login, registration,
  # verification, and recovery flows. Browsers reach its public API at
  # http://identity.bool.test/kratos; its admin API stays on the internal network.
  # Its database address and secrets come from a config file mounted as a secret.
  kratos:
    image: oryd/kratos:v26.2.0
    command: ["serve", "--dev", "--watch-courier", "-c", "/etc/kratos/kratos.yml", "-c", "/run/secrets/kratos.yml"]
    environment:
      # No anonymous usage reports to Ory ("SQA"), in development or tests (C110).
      SQA_OPT_OUT: "true"
    volumes:
      - ./docker/kratos:/etc/kratos:ro
    secrets:
      # Mounted with a .yml name: Kratos picks the format from the extension.
      - source: kratos_config
        target: kratos.yml
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-kratos.rule=Host(`identity.bool.test`) && PathPrefix(`/kratos`)"
      - traefik.http.routers.erp-kratos.entrypoints=web
      - traefik.http.routers.erp-kratos.priority=40
      - traefik.http.routers.erp-kratos.service=erp-kratos
      - traefik.http.routers.erp-kratos.middlewares=erp-auth-limit,erp-kratos-strip
      - traefik.http.middlewares.erp-kratos-strip.stripprefix.prefixes=/kratos
      # Form submissions: 10 a minute per address, against password guessing and
      # code or email flooding (C111).
      - "traefik.http.routers.erp-kratos-submit.rule=Host(`identity.bool.test`) && PathPrefix(`/kratos/self-service`) && Method(`POST`)"
      - traefik.http.routers.erp-kratos-submit.entrypoints=web
      - traefik.http.routers.erp-kratos-submit.priority=41
      - traefik.http.routers.erp-kratos-submit.service=erp-kratos
      - traefik.http.routers.erp-kratos-submit.middlewares=erp-kratos-submit-limit,erp-kratos-strip
      - traefik.http.middlewares.erp-kratos-submit-limit.ratelimit.average=10
      - traefik.http.middlewares.erp-kratos-submit-limit.ratelimit.period=1m
      - traefik.http.middlewares.erp-kratos-submit-limit.ratelimit.burst=10
      - traefik.http.services.erp-kratos.loadbalancer.server.port=4433

  # OAuth2 and OpenID Connect (C83, C89): Ory Hydra with Kratos as its login. Its
  # issuer is http://identity.bool.test/; Traefik routes its standard public paths
  # there. Its admin API stays on the internal network.
  hydra:
    image: oryd/hydra:v26.2.0
    command: ["serve", "all", "--dev", "-c", "/etc/hydra/hydra.yml", "-c", "/run/secrets/hydra.yml"]
    environment:
      # No anonymous usage reports to Ory ("SQA"), in development or tests (C110).
      SQA_OPT_OUT: "true"
    volumes:
      - ./docker/hydra:/etc/hydra:ro
    secrets:
      # Mounted with a .yml name: Hydra picks the format from the extension.
      - source: hydra_config
        target: hydra.yml
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-hydra.rule=Host(`identity.bool.test`) && (PathPrefix(`/oauth2/`) || Path(`/.well-known/openid-configuration`) || Path(`/.well-known/jwks.json`) || Path(`/userinfo`))"
      - traefik.http.routers.erp-hydra.entrypoints=web
      - traefik.http.routers.erp-hydra.priority=40
      - traefik.http.routers.erp-hydra.service=erp-hydra
      - traefik.http.services.erp-hydra.loadbalancer.server.port=4444
      # Looser than erp-auth-limit: in development the BFFs' token requests reach Hydra
      # through Traefik from one address, the Docker host's (C111).
      - traefik.http.middlewares.erp-hydra-limit.ratelimit.average=100
      - traefik.http.middlewares.erp-hydra-limit.ratelimit.burst=200
      - traefik.http.routers.erp-hydra.middlewares=erp-hydra-limit

  # Applies Hydra's own migrations to its database before it starts.
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: ["migrate", "sql", "up", "--yes", "--read-from-env", "-c", "/etc/hydra/hydra.yml", "-c", "/run/secrets/hydra.yml"]
    volumes:
      - ./docker/hydra:/etc/hydra:ro
    secrets:
      - source: hydra_config
        target: hydra.yml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # Registers the first-party OAuth2 clients in docker/hydra/clients (C89): creates
  # missing ones and updates the rest; safe to re-run.
  hydra-clients:
    image: oryd/hydra:v26.2.0
    entrypoint: ["/etc/hydra/register-clients.sh"]
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
    volumes:
      - ./docker/hydra:/etc/hydra:ro
    secrets: [hydra_client_dev-test-client, hydra_client_erp-workspace, hydra_client_erp-admin]
    depends_on:
      hydra:
        condition: service_healthy
    networks:
      - internal

  # Applies Kratos's own migrations to its database before it starts.
  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: ["migrate", "sql", "up", "--yes", "--read-from-env", "-c", "/etc/kratos/kratos.yml", "-c", "/run/secrets/kratos.yml"]
    volumes:
      - ./docker/kratos:/etc/kratos:ro
    secrets:
      # Mounted with a .yml name: Kratos picks the format from the extension.
      - source: kratos_config
        target: kratos.yml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # Catches every email and, through its send API, every SMS in development (C85);
  # inbox at http://mail.bool.test.
  mailpit:
    image: axllent/mailpit:v1.30.4
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-mail.rule=Host(`mail.bool.test`)"
      - traefik.http.routers.erp-mail.entrypoints=web
      - traefik.http.routers.erp-mail.priority=30
      - traefik.http.routers.erp-mail.service=erp-mail
      - traefik.http.services.erp-mail.loadbalancer.server.port=8025

  # Stand-in for Google in development and CI (C85): an OpenID Connect provider at
  # http://oidc.bool.test/default whose login page lets you choose any user.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
      # Port 80, so browsers (through Traefik) and Kratos (through the internal
      # alias below) use the same issuer address, as OpenID Connect requires.
      SERVER_PORT: "80"
    # Lets the non-root process listen on port 80.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      proxy: {}
      internal:
        aliases:
          - oidc.bool.test
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.erp-oidc.rule=Host(`oidc.bool.test`)"
      - traefik.http.routers.erp-oidc.entrypoints=web
      - traefik.http.routers.erp-oidc.priority=30
      - traefik.http.routers.erp-oidc.service=erp-oidc
      - traefik.http.services.erp-oidc.loadbalancer.server.port=80

  # Telemetry viewer for development (C82, replacing Jaeger from C63): one
  # container with an OpenTelemetry Collector (OTLP on 4317/4318 from the API),
  # Prometheus for metrics, Tempo for traces, Loki for logs, and Grafana at
  # http://grafana.bool.test. Data is not persisted; a restart starts empty.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Higher priority than the app's wildcard *.bool.test router.
      - "traefik.http.routers.erp-grafana.rule=Host(`grafana.bool.test`)"
      - traefik.http.routers.erp-grafana.entrypoints=web
      - traefik.http.routers.erp-grafana.priority=30
      - traefik.http.routers.erp-grafana.service=erp-grafana
      - traefik.http.services.erp-grafana.loadbalancer.server.port=3000

secrets:
  # Passwords are files mounted under /run/secrets, as Docker and Kubernetes
  # secrets are in production (C80). These committed files hold throwaway local
  # passwords. A trailing newline would become part of the password: write them
  # with printf '%s', not echo.
  postgres_password:
    file: ./docker/secrets/dev/postgres_password
  db_app_password:
    file: ./docker/secrets/dev/db_app_password
  db_migrate_password:
    file: ./docker/secrets/dev/db_migrate_password
  db_kratos_password:
    file: ./docker/secrets/dev/db_kratos_password
  # Kratos's database address and secrets, as a config file merged over
  # docker/kratos/kratos.yml.
  kratos_config:
    file: ./docker/secrets/dev/kratos.yml
  db_hydra_password:
    file: ./docker/secrets/dev/db_hydra_password
  # Hydra's database address and system secret, merged over docker/hydra/hydra.yml.
  hydra_config:
    file: ./docker/secrets/dev/hydra.yml
  # One secret per first-party client, named hydra_client_<client-id> (C89).
  hydra_client_dev-test-client:
    file: ./docker/secrets/dev/hydra_client_dev-test-client
  hydra_client_erp-workspace:
    file: ./docker/secrets/dev/hydra_client_erp-workspace
  # bff-workspace's AES-256 key for the tokens in its sessions, 64 hex digits (C96).
  bff_workspace_session_key:
    file: ./docker/secrets/dev/bff_workspace_session_key
  hydra_client_erp-admin:
    file: ./docker/secrets/dev/hydra_client_erp-admin
  # bff-admin's AES-256 key, separate from bff-workspace's (C97).
  bff_admin_session_key:
    file: ./docker/secrets/dev/bff_admin_session_key

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  pgdata:
  redis-sessions:
  gocache:
  gomod:
  pnpm-store:
