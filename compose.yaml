name: go-erp

# Local dev stack. Attaches to the shared external `proxy` network (Traefik) at *.bool.test.
# JS services use the go-erp Node 24 + pnpm 11 dev image (docker/node.Dockerfile).
# Grows service-by-service (postgres, kratos, cerbos, api, admin, website) as we build them.

x-node: &node
  build:
    context: ./docker
    dockerfile: node.Dockerfile
  working_dir: /w
  volumes:
    - .:/w
    # Shadow node_modules with per-container volumes so the Linux-built deps here never collide
    # with the host's (macOS) pnpm install from the bind-mounted source tree above.
    - /w/node_modules
    - /w/apps/app/node_modules
    - /w/apps/admin/node_modules
    - /w/apps/website/node_modules
    - /w/packages/ui/node_modules
    - /w/packages/api-client/node_modules
    - /w/packages/auth/node_modules
    # pnpm's content-addressable store also needs to be off the bind mount: hard-linking large
    # packages through the host bind mount (osxfs/virtiofs) corrupts the store silently.
    - pnpm-store:/w/.pnpm-store

services:
  app:
    <<: *node
    command: pnpm --filter app dev
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # tenant subdomains → the app SPA (low priority; fixed hosts like admin.* win at higher priority)
      - "traefik.http.routers.goerp-app.rule=HostRegexp(`^[a-z0-9-]+\\.bool\\.test$`)"
      - traefik.http.routers.goerp-app.entrypoints=web
      - traefik.http.routers.goerp-app.priority=1
      - traefik.http.routers.goerp-app.service=goerp-app
      - traefik.http.services.goerp-app.loadbalancer.server.port=3000

  admin:
    <<: *node
    command: pnpm --filter admin dev
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # fixed operator host (priority 10 beats the tenant HostRegexp)
      - "traefik.http.routers.goerp-admin.rule=Host(`admin.bool.test`)"
      - traefik.http.routers.goerp-admin.entrypoints=web
      - traefik.http.routers.goerp-admin.priority=10
      - traefik.http.routers.goerp-admin.service=goerp-admin
      - traefik.http.services.goerp-admin.loadbalancer.server.port=3000

  website:
    <<: *node
    command: pnpm --filter website dev
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.goerp-website.rule=Host(`website.bool.test`) || Host(`bool.test`)"
      - traefik.http.routers.goerp-website.entrypoints=web
      - traefik.http.routers.goerp-website.priority=10
      - traefik.http.routers.goerp-website.service=goerp-website
      - traefik.http.services.goerp-website.loadbalancer.server.port=3000

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goerp}
      POSTGRES_DB: ${POSTGRES_DB:-goerp}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goerp -d goerp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: applies embedded Goose migrations as the OWNER, then exits. api waits on it.
  migrate:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    working_dir: /w/apps/api
    command: go run ./cmd/migrate up
    environment:
      MIGRATE_DSN: ${MIGRATE_DSN:-postgres://goerp:goerp@postgres:5432/goerp?sslmode=disable}
    volumes:
      - .:/w
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    working_dir: /w/apps/api
    # `go run` never forwards SIGTERM to the compiled binary it spawns as a child process — Docker
    # stop/compose down would silently skip the whole graceful-shutdown path (proven correct in
    # internal/server's own tests, but never exercised here). Build once, then `exec` the binary so
    # it becomes PID 1 and receives the signal directly.
    command: sh -c "go build -o /tmp/goerp-api ./cmd/api && exec /tmp/goerp-api"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # API connects as the NON-OWNER goerp_app role (created by the migrate step).
      APP_DSN: ${APP_DSN:-postgres://goerp_app:goerp_app@postgres:5432/goerp?sslmode=disable}
      APP_PORT: "${APP_PORT:-8080}"
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379}
      # Kratos public = whoami; admin = provisioning/revocation (internal-only). Cerbos = authz PDP.
      APP_KRATOS_PUBLIC_URL: ${APP_KRATOS_PUBLIC_URL:-http://kratos:4433}
      APP_KRATOS_ADMIN_URL: ${APP_KRATOS_ADMIN_URL:-http://kratos:4434}
      APP_CERBOS_HTTP_URL: ${APP_CERBOS_HTTP_URL:-http://cerbos:3592}
    volumes:
      - .:/w
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kratos:
        condition: service_started
      cerbos:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # same-origin /api/* on every subdomain → the Go API (priority beats the SPA routers)
      - "traefik.http.routers.goerp-api.rule=HostRegexp(`^[a-z0-9-]+\\.bool\\.test$`) && PathPrefix(`/api`)"
      - traefik.http.routers.goerp-api.entrypoints=web
      - traefik.http.routers.goerp-api.priority=20
      - traefik.http.routers.goerp-api.service=goerp-api
      - traefik.http.services.goerp-api.loadbalancer.server.port=8080
      # fixed host, direct to the API — no /api prefix needed at all here, this host IS the API
      # (e.g. api.bool.test/v1/me, api.bool.test/healthz); same service as above.
      - "traefik.http.routers.goerp-api-host.rule=Host(`api.bool.test`)"
      - traefik.http.routers.goerp-api-host.entrypoints=web
      - traefik.http.routers.goerp-api-host.priority=10
      - traefik.http.routers.goerp-api-host.service=goerp-api

  # Integration tests (Testcontainers). NOT started by `up` (test profile) — run with:
  #   docker compose run --rm test
  # Spawns a sibling Postgres via the mounted docker socket; HOST_OVERRIDE lets the in-container
  # test process reach the sibling's published port on OrbStack. Ryuk off — the harness self-cleans.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    working_dir: /w/apps/api
    command: go test -tags=integration ./...
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - .:/w
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  redis:
    image: redis:8-alpine
    # cache + rate-limit backend; ephemeral (no persistence). Add a volume if used for a job queue.
    command: redis-server --save "" --appendonly no
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # dev mail catcher — Kratos courier delivers activation/recovery/verification mail here.
  # UI at http://mail.bool.test ; SMTP on :1025 (internal).
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - "traefik.http.routers.goerp-mail.rule=Host(`mail.bool.test`)"
      - traefik.http.routers.goerp-mail.entrypoints=web
      - traefik.http.routers.goerp-mail.priority=10
      - traefik.http.routers.goerp-mail.service=goerp-mail
      - traefik.http.services.goerp-mail.loadbalancer.server.port=8025

  # Cerbos PDP — authz decisions (internal-only, never proxied). Policies mounted from docker/cerbos.
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.44.0
    command: ["server", "--config=/config/config.yaml"]
    volumes:
      - ./docker/cerbos/config:/config:ro
      - ./docker/cerbos/policies:/policies:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: create the `kratos` database (separate from goerp) if absent. Kratos owns its schema.
  kratos-initdb:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-goerp}
    command: >
      sh -c "psql -h postgres -U ${POSTGRES_USER:-goerp} -d ${POSTGRES_DB:-goerp} -tc \"SELECT 1 FROM pg_database WHERE datname='kratos'\" | grep -q 1 || psql -h postgres -U ${POSTGRES_USER:-goerp} -d ${POSTGRES_DB:-goerp} -c 'CREATE DATABASE kratos'"
    networks:
      - internal
    restart: "no"

  # one-shot: apply Kratos' own SQL migrations to the kratos DB.
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    depends_on:
      kratos-initdb:
        condition: service_completed_successfully
    environment:
      DSN: postgres://goerp:goerp@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./docker/kratos:/etc/config/kratos:ro
    command: ["migrate", "sql", "-e", "--yes"]
    networks:
      - internal
    restart: "no"

  # Ory Kratos — identity + sessions. Public served same-origin under /auth on tenant subdomains
  # (Traefik strips /auth). Admin (4434) stays internal-only.
  kratos:
    image: oryd/kratos:v1.3.1
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DSN: postgres://goerp:goerp@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./docker/kratos:/etc/config/kratos:ro
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--dev", "--watch-courier"]
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # same-origin /auth/* on tenant subdomains → Kratos public (strip /auth before forwarding)
      - "traefik.http.routers.goerp-kratos.rule=HostRegexp(`^[a-z0-9-]+\\.bool\\.test$`) && PathPrefix(`/auth`)"
      - traefik.http.routers.goerp-kratos.entrypoints=web
      - traefik.http.routers.goerp-kratos.priority=20
      - "traefik.http.routers.goerp-kratos.middlewares=goerp-kratos-strip"
      - "traefik.http.middlewares.goerp-kratos-strip.stripprefix.prefixes=/auth"
      - traefik.http.routers.goerp-kratos.service=goerp-kratos
      - traefik.http.services.goerp-kratos.loadbalancer.server.port=4433

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  pgdata:
  gocache:
  gomod:
  pnpm-store:
