name: CI

on:
  pull_request:
  push:
    branches: [dev, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Go dev image
        run: docker build -f docker/go.Dockerfile -t erp-go .
      - name: Check formatting, vet, test and build
        run: |
          docker run --rm --network none \
            -v "${{ github.workspace }}/apps/api:/src:ro" -w /src erp-go \
            sh -ec 'test -z "$(gofmt -l cmd internal)"; go vet ./...; go test ./...; go build -buildvcs=false -o /tmp/bool-api ./cmd/api'

  # Typecheck + build each frontend app, in the same Node 24 + pnpm 11 image dev/CI both use
  # (docker/node.Dockerfile) — never the runner's own Node.
  frontend:
    name: ${{ matrix.app }} — typecheck & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared Node dev image
        run: docker build -f docker/node.Dockerfile -t erp-node .
      - name: Install workspace dependencies
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile
      - name: Typecheck
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run typecheck
      - name: Build
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run build

  # Playwright against the real compose stack — mirrors local dev exactly (e2e/run.sh resolves
  # Traefik's IP off the shared `proxy` network and maps *.bool.test to it), except the `proxy`
  # network + Traefik container are normally a shared dev-machine fixture outside this repo, so CI
  # stands up a throwaway one here instead of assuming it pre-exists.
  e2e:
    name: Legacy E2E (deferred during API rebuild)
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: [api-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create the shared proxy network
        run: docker network create proxy

      - name: Start Traefik (docker-label routing, same as the shared dev instance)
        run: |
          docker run -d --name traefik \
            --network proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            traefik:v3.6 \
            --providers.docker=true \
            --providers.docker.network=proxy \
            --providers.docker.exposedbydefault=false \
            --entrypoints.web.address=:80

      - name: Install JS dependencies (populates e2e/node_modules for run.sh)
        run: |
          docker build -f docker/node.Dockerfile -t erp-node .
          docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile

      # .env is gitignored and is the only place config values live, so CI creates it the same way a
      # developer does. compose.yaml interpolates ${VAR} with no fallback — without this, every
      # variable would be empty and the stack would fail rather than quietly start on stale defaults.
      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Bring up the dev stack
        run: docker compose up -d --build

      - name: Wait for the API to start
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' erp-api-1 2>/dev/null)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "api never became healthy" >&2
          docker compose logs
          exit 1

      - name: Seed dev logins (operator + tenant owner)
        run: docker compose run --rm api sh -c "go run -buildvcs=false ./cmd/provision-dev"

      - name: Run Playwright suite
        run: cd e2e && ./run.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker rm -f traefik || true
          docker network rm proxy || true
