name: CI

# Pull requests (C78): merges into develop are not re-checked, because the pull
# request already was. Every job also runs weekly and on a manual run, whatever
# changed, so the scanners report new vulnerabilities in code and images that
# no pull request touched.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

# Actions are pinned to commit SHAs and images to digests (C113): a tag can be moved to other
# code, as trivy-action's were in March 2026. Dependabot updates the Actions and the
# Dockerfiles; the images below and in .github/scripts and e2e/run.sh are updated by hand.
env:
  GO_IMAGE: golang:1.27@sha256:e0174e51e81218523251d85d248a90d24c3d5e81543b4f07a5d66229397db190
  LINT_IMAGE: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
  REDIS_IMAGE: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
  TRAEFIK_IMAGE: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
  GRYPE_IMAGE: anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  GOVULNCHECK_VERSION: v1.8.0
  GO_TEST_COVERAGE_VERSION: v2.19.0

jobs:
  # Decides which jobs a pull request needs (C78). Skipped jobs report success,
  # so required checks (if enabled later) are not left waiting.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the GitHub API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only pull requests are filtered; scheduled and manual runs run every job.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'docker/api.Dockerfile'
              - 'docker/bff.Dockerfile'
              - 'docker/go.Dockerfile'
              - 'docker/postgres/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            frontend:
              - 'apps/workspace/**'
              - 'apps/admin/**'
              - 'apps/identity/**'
              - 'apps/website/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'docker/node.Dockerfile'
              - '.github/workflows/ci.yml'
            # anything the end-to-end suite exercises: apps, BFF, API, identity services, the suite
            e2e:
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'docker/**'
              - 'compose.yaml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.env.example'
              - '.github/workflows/ci.yml'

  api-lint:
    name: API lint
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go-mod
          key: go-mod-${{ hashFiles('apps/api/go.sum') }}
      # Formatting (fmt --diff fails on unformatted code), then the linters (C75).
      - name: Lint
        run: |
          docker run --rm -v "$PWD/apps/api:/src" -v "$HOME/go-mod:/go/pkg/mod" -w /src "$LINT_IMAGE" \
            sh -ec 'golangci-lint fmt --diff ./... && golangci-lint run ./...'

  # Known vulnerabilities in the Go modules that the API's code calls (C113).
  api-vulns:
    name: API vulnerabilities
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go-mod
          key: go-mod-${{ hashFiles('apps/api/go.sum') }}
      - name: govulncheck
        run: |
          docker run --rm -v "$PWD/apps/api:/src" -v "$HOME/go-mod:/go/pkg/mod" -w /src "$GO_IMAGE" \
            go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  api-feature:
    name: API feature tests and coverage
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go-mod
          key: go-mod-${{ hashFiles('apps/api/go.sum') }}
      - name: Start PostgreSQL with the application roles
        run: .github/scripts/start-postgres.sh
      - name: Start Redis
        run: docker run -d --name redis --network ci "$REDIS_IMAGE"
      # Migrate the suite database once, then run the whole suite, unit and
      # TestFeature* tests, against real PostgreSQL and Redis (C77, C79), writing the
      # coverage profile.
      - name: Unit and feature tests
        run: GO_MOD_CACHE="$HOME/go-mod" .github/scripts/run-feature-tests.sh
      # Fails when total coverage drops below apps/api/.testcoverage.yml's threshold
      # (C119). go-test-coverage is GPL-3.0, run here as a tool only, never imported.
      - name: Coverage threshold
        run: |
          docker run --rm -v "$PWD/apps/api:/src" -v "$HOME/go-mod:/go/pkg/mod" -w /src "$GO_IMAGE" \
            go run "github.com/vladopajic/go-test-coverage/v2@$GO_TEST_COVERAGE_VERSION" --config=.testcoverage.yml

  # The only place the binaries are compiled: the production image, whose
  # migrate command then runs against PostgreSQL.
  api-image:
    name: API image
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start PostgreSQL with the application roles
        run: .github/scripts/start-postgres.sh
      - name: Build the production image
        run: docker build -f docker/api.Dockerfile -t erp-api-release .
      - name: Run its migrations
        run: |
          docker run --rm --network ci --entrypoint /usr/local/bin/migrate \
            -e MIGRATE_DB_HOST=postgres -e MIGRATE_DB_NAME=erp -e MIGRATE_DB_USER=erp_migrate \
            -e MIGRATE_DB_PASSWORD_FILE=/run/secrets/db_migrate_password -e MIGRATE_DB_SSLMODE=disable \
            -v "$PWD/docker/secrets/dev:/run/secrets:ro" erp-api-release
      # Known vulnerabilities in the image's packages and binaries, high and critical (C113).
      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$GRYPE_IMAGE" \
            erp-api-release --fail-on high --only-fixed

  # The BFF's release images (C99), one per instance, each with its own app
  # embedded; built when the BFF or the apps change.
  bff-image:
    name: BFF image (${{ matrix.app }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [workspace, admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build -f docker/bff.Dockerfile --build-arg APP=${{ matrix.app }} -t erp-bff-${{ matrix.app }} .
      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$GRYPE_IMAGE" \
            erp-bff-${{ matrix.app }} --fail-on high --only-fixed

  # Typecheck + build each frontend app, in the same Node 26 + pnpm 12 image dev/CI both use
  # (docker/node.Dockerfile) — never the runner's own Node.
  frontend:
    name: ${{ matrix.app }} — typecheck & build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [workspace, admin, identity, website]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the shared Node dev image
        run: docker build -f docker/node.Dockerfile -t erp-node .
      - name: Install workspace dependencies
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile
      - name: Typecheck
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run --if-present typecheck
      - name: Build
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run build

  # Lint and unit tests of every frontend app and package that has them (vitest, eslint);
  # the e2e package's Playwright suite has its own job.
  frontend-checks:
    name: Frontend lint and tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the shared Node dev image
        run: docker build -f docker/node.Dockerfile -t erp-node .
      - name: Install workspace dependencies
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile
      - name: Lint
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm -r --if-present run lint
      - name: Unit tests
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm -r --if-present --filter '!e2e' run test

  # Known vulnerabilities in the frontend's production dependencies, high and critical (C113).
  frontend-audit:
    name: Frontend dependency audit
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the shared Node dev image
        run: docker build -f docker/node.Dockerfile -t erp-node .
      - name: pnpm audit
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm audit --prod --audit-level high

  # Secrets committed anywhere in the history (C113); every pull request, whatever it changes.
  # Gitleaks runs from its image: its GitHub Action needs a paid licence for organisation repositories.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --no-banner --redact --config .gitleaks.toml .

  # End-to-end tests (C109): the Compose stack behind a throwaway Traefik on the runner, then
  # e2e/run.sh (Playwright's image on the proxy and internal networks). Traefik publishes port 80
  # because the BFFs and the API reach the login service's issuer through the host
  # (identity.bool.test -> host-gateway).
  e2e:
    name: End-to-end tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TRAEFIK: localhost # warm.sh reaches the sites through the runner's Traefik
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Traefik on a shared proxy network
        run: |
          docker network create proxy
          docker run -d --name traefik --network proxy -p 80:80 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            "$TRAEFIK_IMAGE" \
            --providers.docker=true \
            --providers.docker.network=proxy \
            --providers.docker.exposedbydefault=false \
            --entrypoints.web.address=:80

      - name: Create .env from the committed example
        run: |
          cp .env.example .env
          # no lgtm service here; without this the API and BFFs log export errors
          printf 'OTEL_TRACES_EXPORTER=none\nOTEL_METRICS_EXPORTER=none\n' >> .env

      - name: Start the stack
        run: |
          docker compose up -d --build --wait postgres redis redis-sessions kratos hydra
          docker compose run --rm deploy
          # run, not up: a failed client registration fails the step
          docker compose run --rm hydra-clients
          docker compose up -d --build --wait api bff-workspace bff-admin identity workspace admin

      # Ready means the site itself answers: 2xx, or 3xx (the login service redirects / into a
      # login flow). Traefik answers 404 (no route yet) or 502/504 (service not up) until then.
      - name: Wait until every site answers through Traefik
        run: |
          for host in identity.bool.test demo.bool.test admin.bool.test; do
            for i in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" http://localhost/ || true)
              case "$code" in 2??|3??) break ;; esac
              sleep 3
            done
            echo "$host: $code"
            case "$code" in 2??|3??) ;; *) docker compose logs; exit 1 ;; esac
          done
          # compile the pages the suite reaches first (run.sh does it again, cheaply)
          e2e/warm.sh

      - name: Run the end-to-end suite
        run: e2e/run.sh

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: e2e/test-results
          retention-days: 7

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker rm -f traefik || true
          docker network rm proxy || true
