name: CI

# Pull requests only (C78): merges into dev/develop are not re-checked, because
# the pull request already was. workflow_dispatch allows a manual run.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

env:
  GO_IMAGE: golang:1.27
  LINT_IMAGE: golangci/golangci-lint:v2.14.0

jobs:
  # Decides which jobs a pull request needs (C78). Skipped jobs report success,
  # so required checks (if enabled later) are not left waiting.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the GitHub API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'docker/api.Dockerfile'
              - 'docker/go.Dockerfile'
              - 'docker/postgres/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            frontend:
              - 'apps/app/**'
              - 'apps/admin/**'
              - 'apps/identity/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'docker/node.Dockerfile'
              - '.github/workflows/ci.yml'

  api-lint:
    name: API lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/go-mod
          key: go-mod-${{ hashFiles('apps/api/go.sum') }}
      # Formatting (fmt --diff fails on unformatted code), then the linters (C75).
      - name: Lint
        run: |
          docker run --rm -v "$PWD/apps/api:/src" -v "$HOME/go-mod:/go/pkg/mod" -w /src "$LINT_IMAGE" \
            sh -ec 'golangci-lint fmt --diff ./... && golangci-lint run ./...'

  api-unit:
    name: API unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/go-mod
          key: go-mod-${{ hashFiles('apps/api/go.sum') }}
      # No external services: feature tests are excluded by their build tag (C77).
      - name: Unit tests
        run: |
          docker run --rm -v "$PWD/apps/api:/src" -v "$HOME/go-mod:/go/pkg/mod" -w /src "$GO_IMAGE" \
            go test -race ./...

  api-feature:
    name: API feature tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/go-mod
          key: go-mod-${{ hashFiles('apps/api/go.sum') }}
      - name: Start PostgreSQL with the application roles
        run: .github/scripts/start-postgres.sh
      - name: Start Redis
        run: docker run -d --name redis --network ci redis:8-alpine
      # Migrate the suite database once, then run only the TestFeature* tests
      # against real PostgreSQL and Redis (C77, C79).
      - name: Feature tests
        run: GO_MOD_CACHE="$HOME/go-mod" .github/scripts/run-feature-tests.sh

  # The only place the binaries are compiled: the production image, whose
  # migrate command then runs against PostgreSQL.
  api-image:
    name: API image
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL with the application roles
        run: .github/scripts/start-postgres.sh
      - name: Build the production image
        run: docker build -f docker/api.Dockerfile -t erp-api-release .
      - name: Run its migrations
        run: |
          docker run --rm --network ci --entrypoint /usr/local/bin/migrate \
            -e MIGRATE_DB_HOST=postgres -e MIGRATE_DB_NAME=erp -e MIGRATE_DB_USER=erp_migrate \
            -e MIGRATE_DB_PASSWORD_FILE=/run/secrets/db_migrate_password -e MIGRATE_DB_SSLMODE=disable \
            -v "$PWD/docker/secrets/dev:/run/secrets:ro" erp-api-release

  # Typecheck + build each frontend app, in the same Node 24 + pnpm 11 image dev/CI both use
  # (docker/node.Dockerfile) — never the runner's own Node.
  frontend:
    name: ${{ matrix.app }} — typecheck & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, admin, identity]
    steps:
      - uses: actions/checkout@v7
      - name: Build the shared Node dev image
        run: docker build -f docker/node.Dockerfile -t erp-node .
      - name: Install workspace dependencies
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile
      - name: Typecheck
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run typecheck
      - name: Build
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run build

  # Playwright against the real compose stack — mirrors local dev exactly (e2e/run.sh resolves
  # Traefik's IP off the shared `proxy` network and maps *.bool.test to it), except the `proxy`
  # network + Traefik container are normally a shared dev-machine fixture outside this repo, so CI
  # stands up a throwaway one here instead of assuming it pre-exists.
  e2e:
    name: Legacy E2E (deferred during API rebuild)
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: [api-unit, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Create the shared proxy network
        run: docker network create proxy

      - name: Start Traefik (docker-label routing, same as the shared dev instance)
        run: |
          docker run -d --name traefik \
            --network proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            traefik:v3.6 \
            --providers.docker=true \
            --providers.docker.network=proxy \
            --providers.docker.exposedbydefault=false \
            --entrypoints.web.address=:80

      - name: Install JS dependencies (populates e2e/node_modules for run.sh)
        run: |
          docker build -f docker/node.Dockerfile -t erp-node .
          docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile

      # .env is gitignored and is the only place config values live, so CI creates it the same way a
      # developer does. compose.yaml interpolates ${VAR} with no fallback — without this, every
      # variable would be empty and the stack would fail rather than quietly start on stale defaults.
      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Bring up the dev stack
        run: docker compose up -d --build

      - name: Wait for the API to start
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' erp-api-1 2>/dev/null)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "api never became healthy" >&2
          docker compose logs
          exit 1

      - name: Seed dev logins (operator + tenant owner)
        run: docker compose run --rm api sh -c "go run -buildvcs=false ./cmd/provision-dev"

      - name: Run Playwright suite
        run: cd e2e && ./run.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker rm -f traefik || true
          docker network rm proxy || true
