name: CI

on:
  pull_request:
  push:
    branches: [dev, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    env:
      # Test-only credentials for a throwaway database.
      PGPASS_OWNER: ci_owner
      PGPASS_APP: ci_app
      PGPASS_MIGRATE: ci_migrate
    steps:
      - uses: actions/checkout@v4
      # A fresh PostgreSQL initialized by the same roles script as Compose, so the
      # tests prove the real privilege model.
      - name: Start PostgreSQL with the application roles
        run: |
          docker network create ci
          docker run -d --name postgres --network ci \
            -e POSTGRES_USER=erp -e POSTGRES_PASSWORD="$PGPASS_OWNER" -e POSTGRES_DB=erp \
            -e POSTGRES_APP_USER=erp_app -e POSTGRES_APP_PASSWORD="$PGPASS_APP" \
            -e POSTGRES_MIGRATE_USER=erp_migrate -e POSTGRES_MIGRATE_PASSWORD="$PGPASS_MIGRATE" \
            -v "${{ github.workspace }}/docker/postgres/init/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro" \
            postgres:18
          for i in $(seq 1 60); do
            docker logs postgres 2>&1 | grep -q "PostgreSQL init process complete" \
              && docker exec postgres pg_isready -h 127.0.0.1 -U erp && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1
      - name: Build the Go dev image
        run: docker build -f docker/go.Dockerfile -t erp-go .
      - name: Check formatting, vet, test and build
        run: |
          docker run --rm --network ci \
            -e POSTGRES_TEST_HOST=postgres -e POSTGRES_TEST_DB=erp \
            -e POSTGRES_TEST_APP_USER=erp_app -e POSTGRES_TEST_APP_PASSWORD="$PGPASS_APP" \
            -e POSTGRES_TEST_MIGRATE_USER=erp_migrate -e POSTGRES_TEST_MIGRATE_PASSWORD="$PGPASS_MIGRATE" \
            -v "${{ github.workspace }}/apps/api:/src:ro" -w /src erp-go \
            sh -ec 'test -z "$(gofmt -l .)"; go vet ./...; go test -race ./...; go build -buildvcs=false -o /tmp/bool-api ./cmd/api; go build -buildvcs=false -o /tmp/bool-migrate ./cmd/migrate'
      # The production image must stay buildable, and its migrate command must run.
      - name: Build the production image and run its migrations
        run: |
          docker build -f docker/api.Dockerfile -t erp-api-release .
          docker run --rm --network ci --entrypoint /usr/local/bin/migrate \
            -e MIGRATE_DB_HOST=postgres -e MIGRATE_DB_NAME=erp -e MIGRATE_DB_USER=erp_migrate \
            -e MIGRATE_DB_PASSWORD="$PGPASS_MIGRATE" -e MIGRATE_DB_SSLMODE=disable erp-api-release

  # Typecheck + build each frontend app, in the same Node 24 + pnpm 11 image dev/CI both use
  # (docker/node.Dockerfile) — never the runner's own Node.
  frontend:
    name: ${{ matrix.app }} — typecheck & build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared Node dev image
        run: docker build -f docker/node.Dockerfile -t erp-node .
      - name: Install workspace dependencies
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile
      - name: Typecheck
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run typecheck
      - name: Build
        run: docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm --filter ${{ matrix.app }} run build

  # Playwright against the real compose stack — mirrors local dev exactly (e2e/run.sh resolves
  # Traefik's IP off the shared `proxy` network and maps *.bool.test to it), except the `proxy`
  # network + Traefik container are normally a shared dev-machine fixture outside this repo, so CI
  # stands up a throwaway one here instead of assuming it pre-exists.
  e2e:
    name: Legacy E2E (deferred during API rebuild)
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: [api-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create the shared proxy network
        run: docker network create proxy

      - name: Start Traefik (docker-label routing, same as the shared dev instance)
        run: |
          docker run -d --name traefik \
            --network proxy \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            traefik:v3.6 \
            --providers.docker=true \
            --providers.docker.network=proxy \
            --providers.docker.exposedbydefault=false \
            --entrypoints.web.address=:80

      - name: Install JS dependencies (populates e2e/node_modules for run.sh)
        run: |
          docker build -f docker/node.Dockerfile -t erp-node .
          docker run --rm -v "${{ github.workspace }}:/w" -w /w erp-node pnpm install --frozen-lockfile

      # .env is gitignored and is the only place config values live, so CI creates it the same way a
      # developer does. compose.yaml interpolates ${VAR} with no fallback — without this, every
      # variable would be empty and the stack would fail rather than quietly start on stale defaults.
      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Bring up the dev stack
        run: docker compose up -d --build

      - name: Wait for the API to start
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' erp-api-1 2>/dev/null)" = "healthy" ] && exit 0
            sleep 2
          done
          echo "api never became healthy" >&2
          docker compose logs
          exit 1

      - name: Seed dev logins (operator + tenant owner)
        run: docker compose run --rm api sh -c "go run -buildvcs=false ./cmd/provision-dev"

      - name: Run Playwright suite
        run: cd e2e && ./run.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker rm -f traefik || true
          docker network rm proxy || true
